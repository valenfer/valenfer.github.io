name: Verificar APIs de AstroAIDA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Probar APIs sin publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      ASTRONOMY_APP_ID: ${{ secrets.ASTRONOMY_APP_ID }}
      ASTRONOMY_APP_SECRET: ${{ secrets.ASTRONOMY_APP_SECRET }}

    steps:
      - name: Descargar la rama candidata
        uses: actions/checkout@v5
        with:
          ref: feature/astroaida
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Ejecutar pruebas locales
        run: |
          python -m unittest discover -s astroaida/tests
          python -m py_compile astroaida/scripts/collect_data.py astroaida/scripts/validate_site.py

      - name: Recopilar datos reales
        id: collect
        continue-on-error: true
        run: python astroaida/scripts/collect_data.py

      - name: Sondear variantes documentadas de Luna
        if: steps.collect.outcome == 'failure'
        shell: bash
        run: |
          today=$(TZ=Europe/Madrid date +%F)
          endpoint="https://api.astronomyapi.com/api/v2/studio/moon-phase"

          probe() {
            label="$1"
            payload="$2"
            status=$(curl --silent --show-error --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              --user "$ASTRONOMY_APP_ID:$ASTRONOMY_APP_SECRET" \
              --header 'Content-Type: application/json' \
              --data "$payload" "$endpoint") || status="transport-error"
            echo "$label: HTTP $status"
          }

          with_orientation=$(printf '{"format":"png","observer":{"latitude":37.38283,"longitude":-5.97317,"date":"%s"},"view":{"type":"portrait-simple","orientation":"north-up"}}' "$today")
          with_style=$(printf '{"format":"png","style":{"moonStyle":"default","backgroundStyle":"stars","backgroundColor":"black","headingColor":"white","textColor":"white"},"observer":{"latitude":37.38283,"longitude":-5.97317,"date":"%s"},"view":{"type":"portrait-simple"}}' "$today")
          with_both=$(printf '{"format":"png","style":{"moonStyle":"default","backgroundStyle":"stars","backgroundColor":"black","headingColor":"white","textColor":"white"},"observer":{"latitude":37.38283,"longitude":-5.97317,"date":"%s"},"view":{"type":"portrait-simple","orientation":"north-up"}}' "$today")

          probe "orientation" "$with_orientation"
          probe "style" "$with_style"
          probe "orientation+style" "$with_both"

      - name: Validar datos reales
        run: python astroaida/scripts/validate_site.py

      - name: Guardar JSON validados sin publicarlos
        uses: actions/upload-artifact@v4
        with:
          name: astroaida-live-data
          path: astroaida/data/*.json
          if-no-files-found: error
          retention-days: 1

      - name: Avisar si alguna fuente no se actualizó
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Una o más fuentes conservaron su último dato válido."
          exit 1
