<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RadarIA</title>
  <link rel="canonical" href="https://valenfer.github.io/radaria/">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="radaria-container">
    <header class="hero">
      <p class="kicker">RadarIA</p>
      <h1>Informes diarios de inteligencia artificial</h1>
      <p class="subtitle">Selección breve, con fuentes primarias y cero confeti innecesario.</p>
    </header>
    <section class="summary-card">
      <h2>Últimos informes</h2>
      <div id="reports"></div>
    </section>
  </main>
  <script src="reports.js"></script>
  <script>
    const root = document.getElementById('reports');
    root.innerHTML = (window.RADARIA_REPORTS || []).map(r => `<article class="news-card"><h2><a href="${r.url}">${r.title}</a></h2><p class="meta">${r.date}</p><p>${r.summary}</p></article>`).join('') || '<p>No hay informes publicados todavía.</p>';
  </script>
</body>
</html>
