<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RadarIA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="radaria-container">
    <header class="hero">
      <p class="kicker">RadarIA</p>
      <h1>Informes diarios de inteligencia artificial</h1>
      <p class="subtitle">Selección breve, citada y sin humo de novedades relevantes en IA.</p>
    </header>
    <section id="reports" class="reports-list">
      <article class="card">
        <span class="badge informe">2026-09-03</span>
        <h2><a href="informes/2026-09-03.html">RadarIA diario — 2026-09-03</a></h2>
        <p>Evaluación realista de agentes, memoria persistente segura, supervisión de agentes web, cuantización extrema y límites de LLM-as-a-judge.</p>
      </article>
    </section>
  </main>
  <script src="reports.js"></script>
  <script>
    const root = document.getElementById('reports');
    const reports = window.RADARIA_REPORTS || [];
    root.innerHTML = reports.map(r => `
      <article class="card">
        <span class="badge informe">${r.date}</span>
        <h2><a href="${r.url}">${r.title}</a></h2>
        <p>${r.summary}</p>
      </article>`).join('') || '<p>No hay informes publicados todavía.</p>';
  </script>
</body>
</html>
